[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-licenselens"
version = "0.4.0"
description = "Dependency license + SBOM gate with offline CVE enrichment, developer-CLI first"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "devtools", "licenselens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/licenselens"

[project.scripts]
"licenselens-emit" = "licenselens.connect:emit_main"
"licenselens-feeds" = "licenselens.datafeeds:main"
licenselens = "licenselens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["licenselens"]
# Ship the offline vulnerability DB + feed catalog inside the wheel so a pip
# install works fully air-gapped with no extra download step.
artifacts = [
    "licenselens/cognis_vulndb.jsonl.gz",
    "licenselens/data_feeds_2026.json",
]

[tool.hatch.build.targets.wheel.force-include]
"licenselens/cognis_vulndb.jsonl.gz" = "licenselens/cognis_vulndb.jsonl.gz"
"licenselens/data_feeds_2026.json" = "licenselens/data_feeds_2026.json"

[tool.hatch.metadata]
allow-direct-references = true
